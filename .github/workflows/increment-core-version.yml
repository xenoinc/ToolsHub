name: Merged PR releases

on:
  pull_request_target:
    branches: [develop, master]
    types: [closed]

permissions:
  contents: read

# Preserve every merge event, rather than replacing pending version increments.
concurrency:
  group: dockzi-release-${{ github.event.pull_request.base.ref }}
  queue: max

jobs:
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      tag: ${{ steps.plan.outputs.tag }}
      package_version: ${{ steps.plan.outputs.package_version }}
      branch: ${{ steps.plan.outputs.branch }}
    steps:
      - name: Check release App configuration
        shell: pwsh
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          foreach ($name in @('RELEASE_APP_ID', 'RELEASE_APP_PRIVATE_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing repository Actions secret: $name. Configure the installed release App before running this workflow."
            }
          }

      # v2 accepts the numeric App ID used by RELEASE_APP_ID.
      # Limit the installation token to this repository and version-commit access.
      - name: Authenticate as the release App
        id: release-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Only merged base-branch code is checked out. Never use the PR head.
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.release-app.outputs.token }}
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Prepare version and pin the release commit
        id: plan
        shell: pwsh
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          $masterBump = 'Revision'
          $labels = @($env:PR_LABELS_JSON | ConvertFrom-Json)
          if ($env:BASE_BRANCH -eq 'master') {
            if ('release:major' -in $labels -and 'release:minor' -in $labels) { throw 'Choose one release label: release:major or release:minor.' }
            if ('release:major' -in $labels) { $masterBump = 'Major' }
            elseif ('release:minor' -in $labels) { $masterBump = 'Minor' }
          }
          $planPath = Join-Path $env:RUNNER_TEMP 'release-plan.json'
          ./scripts/Prepare-MergedRelease.ps1 -BaseBranch $env:BASE_BRANCH -MergeCommit $env:MERGE_SHA -PullRequestNumber ([int]$env:PR_NUMBER) -OutputPath $planPath -MasterBump $masterBump
          $plan = Get-Content -LiteralPath $planPath -Raw | ConvertFrom-Json
          "commit=$($plan.Commit)" >> $env:GITHUB_OUTPUT
          "tag=$($plan.Tag)" >> $env:GITHUB_OUTPUT
          "package_version=$($plan.PackageVersion)" >> $env:GITHUB_OUTPUT
          "branch=$($plan.BaseBranch)" >> $env:GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Validate the exact release commit
        shell: pwsh
        run: ./scripts/Invoke-CI.ps1 -Configuration Release -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'release-validation')
      - name: Build installer and update feed
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'release-validation/packaging.log'
          ./installer/pack.ps1 -Version $env:PACKAGE_VERSION -UpdateUrl ('https://github.com/' + $env:GITHUB_REPOSITORY) *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 60; throw 'Release packaging failed.' }
          Get-Content $log -Tail 20
      - name: Upload complete release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            publish/*.exe
            publish/*.nupkg
            publish/releases.*.json
            publish/assets.*.json
            publish/checksums-*.json
            publish/RELEASES*
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/release-validation/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/release-assets
      - name: Tag and publish the completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.branch }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: >-
          ./scripts/Publish-GitHubRelease.ps1
          -Repository $env:GITHUB_REPOSITORY
          -BaseBranch $env:RELEASE_BRANCH
          -Commit $env:RELEASE_COMMIT
          -AssetsDirectory (Join-Path $env:RUNNER_TEMP 'release-assets')
